---
#
#  A Kubernetes Pod manifest template. Projects a
#  Tycho system object into a YAML pod definition.
#  Tags the object with a system unique
#  GUID label to enable later management.
#
#  Generated by Tycho {{ now() }}
#
apiVersion: v1
kind: Pod
metadata:
  name: {{ system.name }}
  labels:
    name: {{ system.name }}
    username: {{ system.username }}
    app-name: {{ system.system_name }}
    original-app-name: {{ system.system_name }}
    reaper-label: {{ system.system_name }}
    executor: tycho
    tycho-guid: {{ system.identifier }}
    tycho-app-id: {{ system.app_id }}
  annotations:
    helx.renci.org/identity-exempt-containers: userless-volume-tasks
spec:
  enableServiceLinks: false
{% if system.serviceaccount %}
  serviceAccountName: {{system.serviceaccount}}
{% endif %}
{% for container in system.containers %}
  {% if container.limits or container.requests %}
  {% if container.limits.gpus != None and loop.first %}
  tolerations:
  - key: "{{ system.gpu_resource_name }}"
    operator: "Exists"
    effect: "NoSchedule"
  {% endif %}
  {% endif %}
  {% if system.security_context["run_as_user"] or system.security_context.run_as_group or system.security_context.fs_group %}
  securityContext:
    {% if system.security_context["run_as_user"] %}
    runAsUser: {{ system.security_context["run_as_user"] }}
    {% endif %}
    {% if system.security_context.run_as_group %}
    runAsGroup: {{ system.security_context.run_as_group }}
    {% endif %}
    {% if system.security_context.fs_group %}
    fsGroup: {{ system.security_context.fs_group }}
    {% endif %}
  {% endif %}
  {% if (system.enable_init_container == "true") and (system.create_home_dirs == "true") and (system.dev_phase != "test") %}
  initContainers:
  - name: volume-tasks
    image: {{ system.init_image_repository }}:{{ system.init_image_tag }}
    imagePullPolicy: IfNotPresent
    {% if system.init_security_context.run_as_user or system.init_security_context.run_as_group %}
    securityContext:
      {% if system.init_security_context.run_as_user %}
      runAsUser: {{ system.init_security_context.run_as_user }}
      {% endif %}
      {% if system.init_security_context.run_as_group %}
      runAsGroup: {{ system.init_security_context.run_as_group }}
      {% endif %}
    {% endif %}
    # Fixed resources
    resources:
      requests:
        memory: {{ system.init_memory }}
        cpu: {{ system.init_cpus }}
      limits:
        memory: {{ system.init_memory }}
        cpu: {{ system.init_cpus }}
    command: [ 'sh', '-c' ]
    args:
      - |
        HOME_PATH="{{ system.parent_dir }}/{{ system.subpath_dir }}"
        SHARED_OLD_PATH="{{ system.parent_dir }}/{{ system.shared_dir }}"

        mkdir -p "$HOME_PATH"
        mkdir -p "$SHARED_OLD_PATH"

        {% if system.enable_trash_cli == "true" %}
        HOME_TRASH="${XDG_DATA_HOME:-$HOME_PATH/.local/share}/Trash"
        TRASH_AGGREGATE="$HOME_PATH/Trash Bins"

        mkdir -p "$HOME_TRASH"
        mkdir -p "$TRASH_AGGREGATE"
        # Ensure that symlinks can be created by userless init container
        # (symlinking could also be done here but would require a lot of repetition in locating the trash dirs)
        chmod 777 "$TRASH_AGGREGATE"
        {% endif %}

        ls -aln {{ system.parent_dir }}
        echo OK
    volumeMounts:
    {% if system.irods_enabled == True %}
    - name: nfs
      mountPath: "/home/nfs"
    {% endif %}
    {% if container.volumes %}
    {% for volume in system.volumes %}
      {% if container.name == volume['container_name'] %}
        - name: {{ volume["volume_name"] }}
          mountPath: {{ volume["path"] }}
          subPath: {{ volume["subpath"] }}
          readOnly: false
    {% endif %}
    {% endfor %}
    {% endif %}
  - name: userless-volume-tasks
    image: {{ system.init_image_repository }}:{{ system.init_image_tag }}
    imagePullPolicy: IfNotPresent
    securityContext:
      runAsUser: {{ system.init_nobody_uid }}
      runAsGroup: {{ system.init_nobody_gid }}
    # Fixed resources
    resources:
      requests:
        memory: {{ system.init_memory }}
        cpu: {{ system.init_cpus }}
      limits:
        memory: {{ system.init_memory }}
        cpu: {{ system.init_cpus }}
    command: [ 'sh', '-c' ]
    args:
      - |
        HOME_PATH="{{ system.parent_dir }}/{{ system.subpath_dir }}"
        SHARED_OLD_PATH="{{ system.parent_dir }}/{{ system.shared_dir }}"

        # Create shared symlink.
        if [ -d "/shared" ]; then
          ln -sfn "/shared" "$HOME_PATH/shared"
          # On newer deployments using user-mutator, ownership of the old shared directory is given to whoever creates it first.
          # Therefore, the only way to create this deprecation notice is if this initContainer is running as the owner of the dir.
          if [ -w "$SHARED_OLD_PATH" ]; then 
            echo "WARNING: The directory '$SHARED_OLD_PATH' is deprecated.\nPlease use the new shared directory located in your home: '~/shared'" > "$SHARED_OLD_PATH/DEPRECATION_NOTICE.txt"
          else
            echo "Unable to write deprecation notice to '$SHARED_OLD_PATH', proceeding..."
          fi
        fi

        # Create /var/run/helx symlink.
        if [ -d "/var/run/helx" ]; then
          ln -sfn "/var/run/helx" "$HOME_PATH/helx"
        fi

        {% if system.enable_trash_cli == "true" %}
        HOME_TRASH="${XDG_DATA_HOME:-$HOME_PATH/.local/share}/Trash"
        TRASH_AGGREGATE="$HOME_PATH/Trash Bins"

        TRASH_DIRS="$HOME_TRASH"

        # Find mounts and initialize mount trash dirs.
        while read -r line; do
          # extract filesystem type and mount point
          fs=$(echo "$line" | awk '{print $5}')
          mp=$(echo "$line" | awk '{print $3}')

          # Skip pseudo-filesystems
          case "$fs" in
            proc|sysfs|devtmpfs|tmpfs|cgroup|overlay|aufs)
              continue
              ;;
          esac
          # Skip well-known system paths
          case "$mp" in
            /proc*|/sys*|/dev*|/run*|/etc*)
              continue
              ;;
          esac
          # Skip non-directory mounts
          if [ ! -d "$mp" ]; then
            continue
          fi
          # Skip non-readable mounts
          if [ ! -r "$mp" ]; then
            continue
          fi
          # Skip user's home mount. This mount is a special case that is stored under XDG_DATA_HOME.
          if [ "$mp" = "$HOME_PATH" ]; then
            continue
          fi

          TRASH_DIR="$mp/.Trash"
          if [ ! -d "$TRASH_DIR" ]; then
            echo "Creating trash directory: $TRASH_DIR"
            mkdir -p "$TRASH_DIR"
            mkdir -p "$TRASH_DIR/files"
            mkdir -p "$TRASH_DIR/info"
            chmod 1777 "$TRASH_DIR"
            chmod 777 "$TRASH_DIR/files"
            chmod 777 "$TRASH_DIR/info"
          fi
          if [ -d "$TRASH_DIR" ]; then
            TRASH_DIRS="$TRASH_DIRS $TRASH_DIR"
          fi
        done <<EOF
        $(mount)
        EOF

        # Create symlinks to trash bins inside trash aggregate directory
        for dir in $TRASH_DIRS; do
          dir_parent=$(dirname "$dir")
          if [ "$dir" = "$HOME_TRASH" ]; then
            link_name="{{ system.subpath_dir }}_trash"
          elif [ "$dir_parent" = "$SHARED_OLD_PATH" ] && [ -d "/shared" ]; then
            link_name="old_shared_trash"
          else
            link_name=$(echo "$dir_parent" | sed 's|^/||; s|/|_|g')_trash
          fi
          ln -sfn "$dir" "$TRASH_AGGREGATE/$link_name"
        done

        {% endif %}

        echo OK
    volumeMounts:
    {% if container.volumes %}
    {% for volume in system.volumes %}
      {% if container.name == volume['container_name'] %}
        - name: {{ volume["volume_name"] }}
          mountPath: {{ volume["path"] }}
          subPath: {{ volume["subpath"] }}
          readOnly: false
    {% endif %}
    {% endfor %}
    {% endif %}
  {% endif %}
{% endfor %}
  containers:
{% for container in system.containers %}    
  - name: {{ container.name }}
    image: {{ container.image }}
    {% if system.security_context.run_as_user or system.security_context.run_as_group %}
    securityContext:
      {% if system.security_context.run_as_user %}
      runAsUser: {{ system.security_context.run_as_user }}
      {% endif %}
      {% if system.security_context.run_as_group %}
      runAsGroup: {{ system.security_context.run_as_group }}
      {% endif %}
    {% endif %}
{% if container.command %}
    command: {{ container.command }}
{% endif %}
    env:
{% if container.env %}
    {%for e in container.env %}
    - name : {{ e[0] }}
      value : "{{ e[1] }}"
    {% endfor %}
    - name : GUID
      value: {{ system.identifier }}
    - name: USER_NAME
      value: {{ system.username }}
    - name: USER
      value: {{ system.username }}
    - name: ACCESS_TOKEN
      value: {{ system.access_token }}
    - name: PGAPPNAME
      value: {{ system.name }}
    {% for key, value in system.extra_container_env.items() %}
    - name: {{ key }}
      value: {{ value }}
    {%endfor %}
    {% if system.amb %}
    - name: NB_PREFIX
      value: /private/{{system.system_name}}/{{system.username}}/{{system.identifier}}
    - name: FB_BASEURL
      value: /private/{{system.system_name}}/{{system.username}}/{{system.identifier}}
    {% else %}
    - name: NB_PREFIX
      value: /
    - name: FB_BASEURL
      value: /
    {% endif %}
{% endif %}
    - name: HOST
      value: {{ system.host }}
{% if not container.env %}
    - name : GUID
      value: {{ system.identifier }}
    - name: USER_NAME
      value: {{ system.username }}
    - name: USER
      value: {{ system.username }}
    {% if system.amb %}
    - name: NB_PREFIX
      value: /private/{{system.system_name}}/{{system.username}}/{{system.identifier}}
    - name: FB_BASEURL
      value: /private/{{system.system_name}}/{{system.username}}/{{system.identifier}}
    {% else %}
    - name: NB_PREFIX
      value: /
    - name: FB_BASEURL
      value: /
    {% endif %}
{% endif %}
{% if system.system_env %}
  {% for key, value in system.system_env.items() %}
    {% if value is string or value is number or value is boolean %}
    - name: {{ key }}
      value: {{ value }}
    {% endif %}
  {% endfor %}
{% endif %}
{% if container.expose|length > 0 %}
    ports:
{% for port in container.expose %}
    - containerPort: {{ container.expose[loop.index-1]['containerPort'] }}
      protocol: TCP
{% endfor %}     
{% endif %} # ports
{% if container.limits or container.requests %}
    resources:
      limits:
      {% if container.limits %}
      {% if container.limits.cpus != None %}
        cpu: "{{ container.limits.cpus }}"
        memory: "{{ container.limits.memory }}"
      {% endif %}
      {% if container.limits.gpus != None %}
        {{ system.gpu_resource_name }}: {{ container.limits.gpus }}
      {% endif %}
      {% if container.limits.ephemeralStorage != None and container.limits.ephemeralStorage != "0" and container.limits.ephemeralStorage != "" %}
        ephemeral-storage: {{ container.limits.ephemeralStorage }}
      {% endif %}
      {% endif %}
      requests:
      {% if container.requests  %}
      {% if container.requests.cpus != None %}
        cpu: "{{ container.requests.cpus }}"
        memory: "{{ container.requests.memory }}"
      {% endif %}
      {% if container.requests.gpus != None %}
        {{ system.gpu_resource_name }}: {{ container.requests.gpus }}
      {% endif %}
      {% if container.requests.ephemeralStorage != None and container.requests.ephemeralStorage != "0" and container.requests.ephemeralStorage != "" %}
        ephemeral-storage: {{ container.requests.ephemeralStorage }}
      {% endif %}
      {% endif %}
{% endif %}
    volumeMounts:
    {% if system.irods_enabled == True %}
    - name: nfs
      mountPath: "/home/nfs"
    {% endif %}
{% if container.volumes %}
{% for volume in system.volumes %}
  {% if container.name == volume['container_name'] %}
    - name: {{ volume["volume_name"] }}
      mountPath: {{ volume["path"] }}
      subPath: {{ volume["subpath"] }}
      readOnly: false
  {% endif %}
  {% endfor %}
  {% endif %}
{% if container.liveness_probe %}
    livenessProbe:
      {% if container.liveness_probe.cmd %}
      exec:
        command:
          {% for arg in container.liveness_probe.cmd %}
          - {{ arg }}
          {% endfor %}
      {% elif container.liveness_probe.port and container.liveness_probe.path %}
      httpGet:
        path: {{ container.liveness_probe.path }}
        port: {{ container.liveness_probe.port }}
        {% if container.liveness_probe.httpHeaders %}
        httpHeaders:
          {% for name in container.liveness_probe.httpHeaders %}
          - name: {{ name }}
            value: {{ container.liveness_probe.httpHeaders[name] }}
          {% endfor %}
        {% endif %}
      {% elif container.liveness_probe.port %}
      tcpSocket:
        port: {{ container.liveness_probe.port }}
      {% endif %}
    {% if container.liveness_probe.delay %}
    initialDelaySeconds: {{ container.liveness_probe.delay }}
    {% endif %}
    {% if container.liveness_probe.period %}
    periodSeconds: {{ container.liveness_probe.period }}
    {% endif %}
    {% if container.liveness_probe.threshold %}
    failureThreshold: {{ container.liveness_probe.threshold }}
    {% endif %}
{% endif %}
{% if container.readiness_probe %}
    readinessProbe:
      {% if container.readiness_probe.cmd %}
      exec:
        command:
          {% for arg in container.readiness_probe.cmd %}
          - {{ arg }}
          {% endfor %}
      {% elif container.readiness_probe.port and container.readiness_probe.path %}
      httpGet:
        path: {{ container.readiness_probe.path }}
        port: {{ container.readiness_probe.port }}
        {% if container.readiness_probe.httpHeaders %}
        httpHeaders:
          {% for name in container.readiness_probe.httpHeaders %}
          - name: {{ name }}
            value: {{ container.readiness_probe.httpHeaders[name] }}
          {% endfor %}
        {% endif %}
      {% elif container.readiness_probe.port %}
      tcpSocket:
        port: {{ container.readiness_probe.port }}
      {% endif %}
    {% if container.readiness_probe.delay %}
    initialDelaySeconds: {{ container.readiness_probe.delay }}
    {% endif %}
    {% if container.readiness_probe.period %}
    periodSeconds: {{ container.readiness_probe.period }}
    {% endif %}
    {% if container.readiness_probe.threshold %}
    failureThreshold: {{ container.readiness_probe.threshold }}
    {% endif %}
{% endif %}
{% endfor %}
  volumes:
  {% if system.irods_enabled == True %}
  - name: nfs
    nfs:
      server: {{ system.nfsrods_host }}
      path: /
  {% endif %}
# Changes
{% for container in system.containers %}
{% if container.volumes %}
{% for volume in system.volumes %}
  {% if container.name == volume['container_name']%}
  {% if volume["pvc_name"] != None %}
  - name: {{ volume["volume_name"] }}
    persistentVolumeClaim:
      claimName: {{ volume["pvc_name"] }}
  {% endif %}
  {% endif %}
  {% endfor %}
  {% endif %}
  {% endfor %}

