[project]
name = "helx"
version = "0.1.0"
description = "Client library for the helxapp-controller — parse app registries and create Kubernetes workloads."
requires-python = ">=3.12"
dependencies = [
    "kubernetes>=25.3",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "deepmerge>=1.0",
    "requests>=2.32",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src"]
pythonpath = ["src"]
